<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import * as C from './src/chars.js';
import * as Wd from './src/world.js';
const q=new URLSearchParams(location.search); const view=q.get('v')||'city';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); const t0=performance.now();
Wd.buildWorld(s);
const V={
 city:   {time:'day',    cam:[70,95,190], look:[-10,10,-10], fov:42},
 praca:  {time:'day',    cam:[6,20,66],  look:[0,10,6], fov:44},
 morro:  {time:'sunset', cam:[-182,62,-150], look:[-90,46,-50], fov:48},
 noite:  {time:'night',  cam:[-118,56,-92], look:[-150,58,-118], fov:48},
 estacao:{time:'morning',cam:[160,24,-228], look:[118,12,-170], fov:48},
 casa:   {time:'day',    cam:[-14,20,84],  look:[-56,12,70], fov:46},
}[view];
const focus=new THREE.Vector3(...V.look);
Wd.setupLights(s,V.time,focus);
if(V.time==='night') Wd.stars(s);
// birds
const R=(()=>{let k=7;return()=>((k=(k*1664525+1013904223)>>>0)/4294967296)})();
for(let i=0;i<14;i++){const b=Wd.bird([0xff6f6f,0x5ab8ff,0xffd23a,0xffffff,0xb57bff][i%5]); b.position.set(focus.x+(R()*2-1)*60,focus.y+30+R()*35,focus.z+(R()*2-1)*50); b.rotation.y=R()*6; Wd.flap(b,R()*10); s.add(b);}
// characters in scene
const put=(f,x,z,ry=0)=>{const o=f(); o.position.set(x,Wd.groundH(x,z),z); o.rotation.y=ry; s.add(o); return o;};
if(view==='praca'){ put(C.cromo,-6,30,0.3); const p=put(C.petala,8,26,-0.4); p.userData.parts.armL.rotation.z=-2.2; p.userData.parts.armR.rotation.z=1.4; const f=put(C.fuzue,22,18,-0.9); const tb=C.tambor(); tb.position.set(3.6,4.6,3.6); f.add(tb); }
if(view==='morro'||view==='noite'){ const cr=put(C.cromo,Wd.HILL.x+2,Wd.HILL.z+6,view==='noite'?0.9:0.8); if(view==='noite'){cr.userData.parts.head.rotation.x=-0.4;} if(view==='morro'){const v=put(C.viraVento,Wd.HILL.x+14,Wd.HILL.z,0.8); const pp=C.pipa(); pp.scale.setScalar(1.0); pp.position.set(Wd.HILL.x+52,Wd.HILL.h+46,Wd.HILL.z+30); pp.rotation.set(0,0.8,0.25); s.add(pp); v.userData.parts.armR.rotation.z=2.6; const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Wd.HILL.x+17,Wd.HILL.h+16,Wd.HILL.z+3),new THREE.Vector3(Wd.HILL.x+52,Wd.HILL.h+40,Wd.HILL.z+30)]),new THREE.LineBasicMaterial({color:0xffffff})); s.add(ln);} }
if(view==='estacao'){ Wd.train(s,40,-185);  put(C.viraVento,124,-172,Math.PI-0.3); put(C.cromo,138,-171,Math.PI+0.3); put(C.petala,110,-171,Math.PI); put(C.goma,100,-170,Math.PI+0.2); put(C.fuzue,150,-170,Math.PI-0.2); }
if(view==='casa'){ put(C.cromo,-36,68,-1.3); const v=put(C.viraVento,-40,74,1.6); }
const cam=new THREE.PerspectiveCamera(V.fov,W/H,1,2000); cam.position.set(...V.cam); cam.lookAt(focus);
r.render(s,cam); console.log('render ms', Math.round(performance.now()-t0)); window.DONE=true;
</script></body></html>
